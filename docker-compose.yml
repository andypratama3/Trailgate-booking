name: trailgate

x-api-environment: &api-environment
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-trailgate}
  DB_USERNAME: ${MYSQL_USER:-trailgate}
  DB_PASSWORD: ${MYSQL_PASSWORD:-local-dev-only}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SESSION_DRIVER: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    working_dir: /var/www/html
    # --no-reload wajib di container: tanpa flag itu ServeCommand membuang DB_HOST/REDIS_HOST
    # dari environment proses `php -S`, sehingga .env (127.0.0.1) yang dipakai dan koneksi gagal.
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
             grep -q '^APP_KEY=.' .env || php artisan key:generate --force;
             [ -d vendor ] || composer install --no-interaction --prefer-dist;
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    environment: *api-environment
    volumes:
      - ./apps/api:/var/www/html
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
             [ -d vendor ] || composer install --no-interaction --prefer-dist;
             php artisan queue:work --sleep=1 --tries=1 --verbose"
    environment: *api-environment
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    working_dir: /app
    command: >
      sh -c "pnpm install --frozen-lockfile &&
             pnpm --filter @trailgate/web exec next dev -H 0.0.0.0 -p 3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-only-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trailgate}
      MYSQL_USER: ${MYSQL_USER:-trailgate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-only}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  web_node_modules:
