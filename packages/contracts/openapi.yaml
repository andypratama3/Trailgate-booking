  /v1/console/rules/{id}:
    parameters:
      - $ref: '#/components/parameters/PathRuleId'
    put:
      operationId: updateRule
      security:
        - sessionCookie: []
      tags: [console]
      summary: Ubah requirement rule
      description: >
        Mengubah severity/params/masa berlaku rule. Hanya peran dengan scope
        `console.rules.write` (yaitu `tenant_admin`); peran `kasir` menerima 403 (AC-01.2).
      x-auth: session
      x-rbac-scopes: [console.rules.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdateRequest'
      responses:
        "200":
          description: Rule setelah perubahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementRule'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/pos/sync:
    post:
      operationId: syncPosEvents
      security:
        - posDeviceToken: []
      tags: [pos]
      summary: Sinkron batch event check-in/out
      description: >
        Menerima batch event yang diantre di IndexedDB saat offline. Idempoten per
        `client_event_id` (UNIQUE, PRD §10.2): duplikat dibuang, bukan digandakan (AC-16.1).
        Konflik scan diselesaikan **first scan wins** dan dicatat di log; tiket yang sudah
        dipindai dua kali memicu peringatan, bukan kegagalan (PRD §10.4, ADR-004 keputusan 4).
        Batch > `maxItems` → 422.
      x-auth: pos_device
      x-rbac-scopes: [pos.scan]
      x-adr: [ADR-004]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosSyncRequest'
      responses:
        "200":
          description: Hasil sinkron.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSyncResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/pos/manifest:
    get:
      operationId: getPosManifest
      security:
        - posDeviceToken: []
      tags: [pos]
      summary: Manifest untuk cache offline POS
      description: >
        Snapshot referensi + nama untuk cache POS (ADR-004 keputusan 5). **Tanpa PII**:
        hanya `member_id`, `booking_code`, `full_name`, `ticket_id`, status in/out — tidak ada
        NIK/paspor/surat sehat. `manifest_version` naik setiap perubahan; POS membuang cache
        lama saat versi baru diterima.
      x-auth: pos_device
      x-rbac-scopes: [pos.scan]
      x-adr: [ADR-004]
      x-paginated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: route_slug
          in: query
          required: false
          schema:
            type: string
            example: rinjani-sembalun
        - name: date
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LocalDate'
      responses:
        "200":
          description: Manifest (ter-paginasi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosManifest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/pos/revocations:
    get:
      operationId: getPosRevocations
      security:
        - posDeviceToken: []
      tags: [pos]
      summary: Daftar revoke tiket + kunci publik verifikasi
      description: >
        Dipakai POS untuk verifikasi QR offline (ADR-004 keputusan 3, PRD §10.4). `ticket_public_key`
        adalah kunci publik verifikasi tanda tangan tiket; daftar revoke dipakai untuk menolak
        token yang dibatalkan. POS menandai dirinya *stale* bila `generated_at` terlalu lama.
      x-auth: pos_device
      x-rbac-scopes: [pos.scan]
      x-adr: [ADR-004]
      x-paginated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: since
          in: query
          required: false
          description: Ambil revoke setelah waktu ini (sinkron inkremental).
          schema:
            $ref: '#/components/schemas/DateTime'
      responses:
        "200":
          description: Daftar revoke (ter-paginasi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosRevocationList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/tenants:
    get:
      operationId: listTenants
      security:
        - platformAdminToken: []
      tags: [admin]
      summary: Daftar tenant (lintas-tenant)
      description: >
        Akses super admin lintas-tenant — bypass scope yang disengaja dan tercatat di ADR-001
        keputusan 5.
      x-auth: platform_admin
      x-rbac-scopes: [admin.tenants.read]
      x-adr: [ADR-001]
      x-paginated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TenantStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TenantType'
      responses:
        "200":
          description: Daftar tenant (ter-paginasi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createTenant
      security:
        - platformAdminToken: []
      tags: [admin]
      summary: Buat tenant
      description: >
        Onboarding tenant tanpa sentuhan kode (FR-01). Tenant baru selalu butuh langkah
        operasional tambahan: mengisi kredensial Midtrans sendiri sebelum dapat menjual tiket
        (`payment_ready`, ADR-002 konsekuensi).
      x-auth: platform_admin
      x-rbac-scopes: [admin.tenants.write]
      x-adr: [ADR-001, ADR-002]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        "201":
          description: Tenant dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: Slug tenant sudah dipakai. `code` = `conflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/tenants/{slug}:
    parameters:
      - $ref: '#/components/parameters/PathSlug'
    get:
      operationId: getTenant
      security:
        - platformAdminToken: []
      tags: [admin]
      summary: Detail tenant
      x-auth: platform_admin
      x-rbac-scopes: [admin.tenants.read]
      responses:
        "200":
          description: Detail tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateTenant
      security:
        - platformAdminToken: []
      tags: [admin]
      summary: Ubah status/kesiapan bayar tenant
      description: >
        Menangguhkan/mengaktifkan tenant dan menandai kesiapan bayar. Mematikan
        `payment_ready` membuat `POST /v1/bookings/{code}/pay` menolak dengan
        `tenant_not_payment_ready` (ADR-002 keputusan 7).
      x-auth: platform_admin
      x-rbac-scopes: [admin.tenants.write]
      x-adr: [ADR-002]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        "200":
          description: Tenant setelah perubahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/admin/billing:
    get:
      operationId: listBillingInvoices
      security:
        - platformAdminToken: []
      tags: [admin]
      summary: Invoice bulanan platform (P3)
      description: >
        Fee platform ditagih terpisah sebagai invoice bulanan, bukan potongan dari transaksi
        tenant (ADR-002 keputusan 6). Fase P3 (FR-28): kontrak disiapkan, implementasi menyusul.
      x-auth: platform_admin
      x-rbac-scopes: [admin.billing.read]
      x-adr: [ADR-002]
      x-paginated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: tenant_slug
          in: query
          required: false
          schema:
            type: string
            example: rinjani-basecamp
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
      responses:
        "200":
          description: Daftar invoice (ter-paginasi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoiceList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: trailgate_session
      description: >
        Sesi konsol/tenant (cookie HttpOnly, sesi pendek). Peran ditentukan RBAC tenant;
        tenant admin wajib MFA (PRD §13, AC-01.3).
    bookingLinkToken:
      type: http
      scheme: bearer
      description: >
        Token bertanda tangan berumur pendek untuk satu booking (dibuat saat hold, dibagikan
        ke ketua/anggota). Bukan akun pengguna.
    posDeviceToken:
      type: http
      scheme: bearer
      description: Token perangkat POS per tenant (ADR-004 keputusan 7); hanya untuk scope `pos.scan`.
    platformAdminToken:
      type: http
      scheme: bearer
      description: Token super admin platform (lintas tenant; bypass scope tercatat, ADR-001 keputusan 5).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Kunci idempotensi unik per tenant + per operasi (PRD §10.3/§11). Kirim ulang key yang
        sama untuk retry jaringan: server mengembalikan hasil yang sama, bukan membuat
        resource/charge kedua (AC-27.3). Disimpan 24 jam.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        example: 8f14e45fceea167a5a36dedd4bea2543
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Opsional pada webhook Midtrans: pemanggil adalah penyedia pembayaran, bukan klien kita.
        Idempotensi diturunkan dari `order_id` + signature dan `payments.provider_ref` unik
        (ADR-002 keputusan 3/4).
      schema:
        type: string
        minLength: 8
        maxLength: 255
        example: midtrans-order-20261231-0001
    Page:
      name: page
      in: query
      required: false
      description: Halaman (mulai 1).
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        example: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Jumlah baris per halaman (maksimum 100).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    PathSlug:
      name: slug
      in: path
      required: true
      description: Slug resource (jalur atau tenant), huruf kecil dan tanda hubung.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 2
        maxLength: 80
        example: rinjani-sembalun
    PathRouteSlug:
      name: route_slug
      in: path
      required: true
      description: Slug jalur.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 2
        maxLength: 80
        example: rinjani-sembalun
    PathDate:
      name: date
      in: path
      required: true
      description: Tanggal slot dalam zona waktu jalur (`routes.timezone`, AC-26.4).
      schema:
        $ref: '#/components/schemas/LocalDate'
    PathBookingCode:
      name: code
      in: path
      required: true
      description: Kode booking unik (PRD §10.2).
      schema:
        type: string
        pattern: '^[A-Z0-9-]{6,20}$'
        example: TG-7QK2M9
    PathMemberId:
      name: id
      in: path
      required: true
      description: ID anggota booking. Identitas penuh (NIK/paspor) tidak pernah dipakai untuk pencarian (ADR-005 keputusan 3).
      schema:
        type: string
        minLength: 1
        maxLength: 36
        example: 018f3a1e-8f2b-7a44-9c67-2f1e4b5c6d70
    PathDocumentId:
      name: document_id
      in: path
      required: true
      description: ID baris metadata dokumen.
      schema:
        type: string
        minLength: 1
        maxLength: 36
        example: 018f3a1e-9b21-7c35-a1d2-8e4f5a6b7c81
    PathClosureId:
      name: id
      in: path
      required: true
      description: ID closure.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 42
    PathDisruptionId:
      name: id
      in: path
      required: true
      description: ID Disruption Case.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 108
    PathRuleId:
      name: id
      in: path
      required: true
      description: ID requirement rule.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 7
    PathTenant:
      name: tenant
      in: path
      required: true
      description: >
        Slug tenant pada webhook Midtrans — pengecualian tenancy yang diwajibkan PRD §11 dan
        ADR-002 keputusan 3 (URL ini didaftarkan di akun Midtrans tenant).
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        minLength: 2
        maxLength: 80
        example: rinjani-basecamp
  headers:
    RetryAfter:
      description: Detik sebelum permintaan berikutnya boleh dikirim.
      schema:
        type: integer
        format: int32
        minimum: 0
        example: 60
  responses:
    BadRequest:
      description: Permintaan tidak dapat diproses. `code` = `validation_failed`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Kredensial tidak ada/invalid/kedaluwarsa. `code` = `unauthorized`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        Terautentikasi tetapi tidak berwenang (scope RBAC tidak dimiliki). `code` = `forbidden`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >
        Resource tidak ada — termasuk resource milik tenant lain (isolasi tenant tidak boleh
        membocorkan keberadaan data, AC-01.1). `code` = `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflik status/kuota/idempotensi. `code` = `conflict`, `quota_exceeded`, `slot_closed`, `idempotency_conflict`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Payload valid secara sintaks tetapi melanggar aturan domain. `code` = `validation_failed`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >
        Melewati rate limit per IP/akun/tenant (PRD §11/§13, AC-27.1). `code` = `rate_limited`.
        Selama pembukaan kuota, permintaan booking boleh masuk waiting room; klien menghormati
        `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Galat tak terduga. `code` = `internal_error`. Detail teknis tidak dibocorkan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Amplop galat standar (PRD §11). Selalu `{code, message, details}`.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: Pesan manusiawi (Bahasa Indonesia) untuk ditampilkan/di-log.
        details:
          type: [object, "null"]
          additionalProperties: true
          description: Detail terstruktur (mis. daftar field gagal validasi). `null` bila tidak ada.
      example:
        code: quota_exceeded
        message: Sisa kuota tidak cukup untuk tanggal yang diminta.
        details:
          route_slug: rinjani-sembalun
          date: '2026-12-31'
          remaining: 3
          requested: 5
    ErrorCode:
      type: string
      description: Daftar tertutup kode galat.
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - idempotency_conflict
        - quota_exceeded
        - slot_closed
        - booking_window_closed
        - official_link_no_transaction
        - tenant_not_payment_ready
        - reschedule_not_allowed
        - members_locked
        - webhook_signature_invalid
        - rate_limited
        - payload_too_large
        - report_format_unsupported
        - internal_error
      example: rate_limited
    PageMeta:
      type: object
      description: Metadata pagination (satu-satunya bentuk `meta` yang dipakai kontrak ini).
      required: [page, per_page, total, total_pages]
      additionalProperties: false
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        per_page:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          format: int64
          minimum: 0
          example: 1
        total_pages:
          type: integer
          format: int32
          minimum: 0
          example: 1
      example:
        page: 1
        per_page: 20
        total: 1
        total_pages: 1
    Money:
      type: integer
      format: int64
      minimum: 0
      x-money: true
      description: >
        Nominal dalam **integer rupiah** (tanpa desimal, tanpa pecahan sen). `float`/`double`
        dilarang (ADR-002 keputusan 9, AGENTS.md aturan 6). MVP tidak multi-currency.
      example: 350000
    DateTime:
      type: string
      format: date-time
      description: >
        Timestamp RFC 3339 dengan offset eksplisit. Disimpan UTC; jadwal/jendela kuota
        dievaluasi dalam zona waktu jalur (`routes.timezone`, mis. `Asia/Makassar`, AC-26.4).
      example: '2026-12-31T01:00:00+08:00'
    LocalDate:
      type: string
      format: date
      description: >
        Tanggal kalender dalam zona waktu jalur (`routes.timezone`, AC-26.4). `2026-12-31`
        berarti 31 Desember 2026 di `Asia/Makassar` untuk jalur Rinjani, bukan di zona server.
      example: '2026-12-31'
    Timezone:
      type: string
      pattern: '^(UTC|[A-Za-z_]+(/[A-Za-z_+-]+)+)$'
      description: >
        Zona waktu IANA jalur (`routes.timezone`), dipakai untuk semua evaluasi tanggal/jam
        jalur itu (PRD §8, AC-26.4).
      example: Asia/Makassar
    RouteStatusValue:
      type: string
      enum: [open, closed, partially_closed, unknown]
      description: Status operasional jalur.
      example: open
    RequirementRuleType:
      type: string
      description: Tipe aturan yang didukung rule engine (PRD §6.2).
      enum:
        - min_age_unaccompanied
        - minor_requires_guardian_consent
        - beginner_requires_guide
        - health_cert_max_age_hours
        - informed_consent_required
        - insurance_info_required
        - guide_ratio
        - porter_ratio
        - max_group_size
        - min_group_size
        - booking_window_days
        - booking_cutoff_hours
        - max_stay_nights
        - required_documents
        - reschedule_policy
        - refund_policy
        - quota_open_schedule
      example: health_cert_max_age_hours
    RuleScope:
      type: string
      enum: [tenant, mountain, route]
      description: Cakupan rule (PRD §6.2).
      example: route
    RuleSeverity:
      type: string
      enum: [block, warn]
      description: Efek hasil evaluasi (PRD §6.1).
      example: block
    BookingStatus:
      type: string
      description: Status pada state machine booking (PRD §7.1).
      enum:
        - Draft
        - Held
        - PendingPayment
        - Paid
        - NeedsAction
        - Confirmed
        - CheckedIn
        - CheckedOut
        - Overdue
        - Completed
        - Rescheduled
        - Disrupted
        - Cancelled
        - Refunded
        - Expired
      example: Held
    DocumentType:
      type: string
      enum: [health_cert, guardian_consent, consent, insurance_proof]
      description: Jenis dokumen (FR-10).
      example: health_cert
    DocumentStatus:
      type: string
      enum: [pending_upload, uploaded, verified, rejected]
      example: pending_upload
    ClosureMode:
      type: string
      enum: [block_new_bookings, cancel_existing, partial_hours, partial_route]
      description: Mode closure (PRD §6.4).
      example: block_new_bookings
    ClosureStatus:
      type: string
      enum: [proposed, active, cancelled, completed]
      example: active
    DisruptionStatus:
      type: string
      enum: [open, in_progress, resolved]
      example: in_progress
    TenantType:
      type: string
      enum: [saas, template, official_link]
      description: Tipe tenant (PRD §4.1).
      example: saas
    TenantStatus:
      type: string
      enum: [pending, active, suspended]
      example: active
    InvoiceStatus:
      type: string
      enum: [draft, issued, paid, void]
      example: issued
    ReportType:
      type: string
      enum: [bookings, revenue, checkins, closure_impact]
      example: bookings
    PaymentStatus:
      type: string
      enum: [pending, settled, expired, failed, refunded]
      example: settled
    PaymentChannel:
      type: string
      enum: [snap, va, qris]
      description: Kanal pembayaran Midtrans (FR-13, PRD §12).
      example: qris
    LedgerEntryType:
      type: string
      enum: [payment, refund, platform_fee]
      description: Jenis entri buku besar append-only (PRD §10.2, ADR-002 keputusan 6).
      example: payment
    RequirementRule:
      type: object
      description: Satu aturan persyaratan jalur. Wajib bersumber (PRD §6.1).
      required:
        [id, scope, type, params, severity, source_url, verified_at, effective_from]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 7
        scope:
          $ref: '#/components/schemas/RuleScope'
        route_slug:
          type: [string, "null"]
          description: Terisi bila `scope` = `route`.
          example: rinjani-sembalun
        type:
          $ref: '#/components/schemas/RequirementRuleType'
        params:
          type: object
          additionalProperties: true
          description: Parameter aturan (bentuknya bergantung `type`).
          example:
            hours: 24
        severity:
          $ref: '#/components/schemas/RuleSeverity'
        source_url:
          type: string
          format: uri
          description: Sumber aturan (wajib; PRD §6.1/AGENTS.md aturan 4).
          example: https://rinjani.example.go.id/sop-pendakian-2026
        source_ref:
          type: [string, "null"]
          description: Nomor surat/dokumen resmi.
          example: 'SK.42/BTNGP/2026'
        verified_at:
          $ref: '#/components/schemas/LocalDate'
        effective_from:
          $ref: '#/components/schemas/LocalDate'
        effective_to:
          type: [string, "null"]
          format: date
          description: Batas akhir berlaku (null = tidak ada batas).
          example: '2027-06-30'
        note:
          type: [string, "null"]
          maxLength: 300
          example: VERIFIKASI ke SOP resmi terbaru.
      example:
        id: 7
        scope: route
        route_slug: rinjani-sembalun
        type: health_cert_max_age_hours
        params:
          hours: 24
        severity: block
        source_url: https://rinjani.example.go.id/sop-pendakian-2026
        source_ref: SK.42/BTNGP/2026
        verified_at: '2026-11-01'
        effective_from: '2026-11-01'
        effective_to: null
        note: null
    AvailabilitySummary:
      type: object
      description: Ringkasan ketersediaan untuk katalog jalur.
      required: [next_available_date, remaining_next_7_days]
      additionalProperties: false
      properties:
        next_available_date:
          type: [string, "null"]
          format: date
          description: Tanggal terdekat dengan sisa kuota (null bila tidak ada).
          example: '2026-12-31'
        remaining_next_7_days:
          type: integer
          format: int32
          minimum: 0
          description: Total sisa kuota 7 hari ke depan (zona waktu jalur).
          example: 42
      example:
        next_available_date: '2026-12-31'
        remaining_next_7_days: 42
    Route:
      type: object
      description: Jalur pendakian tenant.
      required:
        [slug, name, mountain_slug, mountain_name, timezone, max_group_size, status,
         booking_enabled, availability_summary]
      additionalProperties: false
      properties:
        slug:
          type: string
          example: rinjani-sembalun
        name:
          type: string
          example: Rinjani — Sembalun
        mountain_slug:
          type: string
          example: rinjani
        mountain_name:
          type: string
          example: Gunung Rinjani
        timezone:
          $ref: '#/components/schemas/Timezone'
        max_group_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 12
        status:
          $ref: '#/components/schemas/RouteStatusValue'
        booking_enabled:
          type: boolean
          description: >
            `false` untuk tenant `official_link` (tanpa transaksi, AC-35.2) atau jalur yang
            ditutup untuk booking baru.
          example: true
        deep_link_url:
          type: [string, "null"]
          format: uri
          description: Deep-link ke sistem booking resmi (Official Link Mode, FR-35).
          example: null
        official_system_name:
          type: [string, "null"]
          description: Nama sistem resmi yang ditautkan (mis. eRinjani).
          example: null
        geojson:
          type: [object, "null"]
          additionalProperties: true
          description: GeoJSON jalur (FR-04).
          example: null
        last_status_check:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
          description: Kapan status jalur terakhir diverifikasi.
          example: '2026-11-24T09:15:00+08:00'
        requirements:
          type: array
          description: Rule persyaratan aktif untuk jalur ini.
          items:
            $ref: '#/components/schemas/RequirementRule'
        availability_summary:
          $ref: '#/components/schemas/AvailabilitySummary'
      example:
        slug: rinjani-sembalun
        name: Rinjani — Sembalun
        mountain_slug: rinjani
        mountain_name: Gunung Rinjani
        timezone: Asia/Makassar
        max_group_size: 12
        status: open
        booking_enabled: true
        deep_link_url: null
        official_system_name: null
        geojson: null
        last_status_check: '2026-11-24T09:15:00+08:00'
        requirements:
          - id: 7
            scope: route
            route_slug: rinjani-sembalun
            type: health_cert_max_age_hours
            params:
              hours: 24
            severity: block
            source_url: https://rinjani.example.go.id/sop-pendakian-2026
            source_ref: SK.42/BTNGP/2026
            verified_at: '2026-11-01'
            effective_from: '2026-11-01'
            effective_to: null
            note: null
        availability_summary:
          next_available_date: '2026-12-31'
          remaining_next_7_days: 42
    RouteList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        meta:
          $ref: '#/components/schemas/PageMeta'
      example:
        data:
          - slug: rinjani-sembalun
            name: Rinjani — Sembalun
            mountain_slug: rinjani
            mountain_name: Gunung Rinjani
            timezone: Asia/Makassar
            max_group_size: 12
            status: open
            booking_enabled: true
            deep_link_url: null
            official_system_name: null
            geojson: null
            last_status_check: '2026-11-24T09:15:00+08:00'
            requirements: []
            availability_summary:
              next_available_date: '2026-12-31'
              remaining_next_7_days: 42
        meta:
          page: 1
          per_page: 20
          total: 1
          total_pages: 1
    RouteStatus:
      type: object
      description: Status buka/tutup jalur dengan sumber dan waktu verifikasi.
      required: [route_slug, status, checked_at, source]
      additionalProperties: false
      properties:
        route_slug:
          type: string
