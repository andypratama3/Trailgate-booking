        checked_at: '2026-11-24T09:15:00+08:00'
        next_closure: null
    AvailabilityDay:
      type: object
      description: Ketersediaan satu tanggal.
      required: [date, capacity, effective_capacity, reserved, sold, remaining, status]
      additionalProperties: false
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        capacity:
          type: integer
          format: int32
          minimum: 0
          description: Kapasitas dasar slot.
          example: 300
        effective_capacity:
          type: integer
          format: int32
          minimum: 0
          description: Kapasitas efektif (0 bila closure aktif; dihitung service, bukan klien).
          example: 300
        reserved:
          type: integer
          format: int32
          minimum: 0
          description: Kuota tertahan hold yang belum dibayar.
          example: 30
        sold:
          type: integer
          format: int32
          minimum: 0
          description: Kuota terjual.
          example: 228
        remaining:
          type: integer
          format: int32
          minimum: 0
          description: Sisa kuota yang masih bisa dijual.
          example: 42
        status:
          type: string
          enum: [open, full, closed, booking_closed]
          description: >
            `closed` = closure aktif; `full` = kuota habis; `booking_closed` = di luar jendela
            pembukaan/cutoff (evaluasi zona waktu jalur, AC-26.4).
          example: open
      example:
        date: '2026-12-31'
        capacity: 300
        effective_capacity: 300
        reserved: 30
        sold: 228
        remaining: 42
        status: open
    AvailabilityResponse:
      type: object
      description: Ketersediaan kuota untuk rentang tanggal.
      required: [route_slug, timezone, from, to, days, generated_at]
      additionalProperties: false
      properties:
        route_slug:
          type: string
          example: rinjani-sembalun
        timezone:
          $ref: '#/components/schemas/Timezone'
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        days:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AvailabilityDay'
        generated_at:
          $ref: '#/components/schemas/DateTime'
      example:
        route_slug: rinjani-sembalun
        timezone: Asia/Makassar
        from: '2026-12-31'
        to: '2026-12-31'
        days:
          - date: '2026-12-31'
            capacity: 300
            effective_capacity: 300
            reserved: 30
            sold: 228
            remaining: 42
            status: open
        generated_at: '2026-11-24T09:15:00+08:00'
    BookingLeader:
      type: object
      description: Data ketua rombongan pada saat hold.
      required: [full_name, identity_type, identity_number, is_foreign, birth_date, phone, email]
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 120
          example: Bayu Pratama
        identity_type:
          type: string
          enum: [nik, passport]
          description: NIK (WNI) atau paspor (WNA) — `is_foreign` harus konsisten.
          example: nik
        identity_number:
          type: string
          minLength: 6
          maxLength: 32
          description: >
            Disimpan terenkripsi (ADR-005 keputusan 1) dan tidak dapat di-query; jangan pernah
            dikembalikan dalam plaintext oleh API.
          example: '3201234567890001'
        is_foreign:
          type: boolean
          example: false
        birth_date:
          $ref: '#/components/schemas/LocalDate'
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
          example: '+628123456789'
        email:
          type: string
          format: email
          maxLength: 254
          example: bayu@example.com
      example:
        full_name: Bayu Pratama
        identity_type: nik
        identity_number: '3201234567890001'
        is_foreign: false
        birth_date: '1994-05-17'
        phone: '+628123456789'
        email: bayu@example.com
    BookingItemRequest:
      type: object
      description: Item tambahan yang diminta saat hold (FR-12).
      required: [type, quantity]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [guide, porter, gear_rental, transport, homestay, insurance]
          example: porter
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          example: 2
      example:
        type: porter
        quantity: 2
    BookingHoldRequest:
      type: object
      description: Permintaan hold kuota.
      required: [route_slug, date, party_size, leader]
      additionalProperties: false
      properties:
        route_slug:
          type: string
          example: rinjani-sembalun
        date:
          $ref: '#/components/schemas/LocalDate'
        party_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
          description: Jumlah pendaki (termasuk ketua).
          example: 5
        leader:
          $ref: '#/components/schemas/BookingLeader'
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/BookingItemRequest'
        note:
          type: [string, "null"]
          maxLength: 500
          example: null
      example:
        route_slug: rinjani-sembalun
        date: '2026-12-31'
        party_size: 5
        leader:
          full_name: Bayu Pratama
          identity_type: nik
          identity_number: '3201234567890001'
          is_foreign: false
          birth_date: '1994-05-17'
          phone: '+628123456789'
