      summary: Webhook notifikasi Midtrans per tenant
      description: |
        **Pengecualian tenancy yang disengaja**: satu-satunya endpoint yang memuat tenant di
        path (`{tenant}`), sesuai PRD §11 dan ADR-002 keputusan 3, karena URL ini yang
        didaftarkan Midtrans di akun tenant.

        Alur wajib: (a) resolusi tenant dari path, (b) verifikasi signature dengan server key
        tenant itu, (c) verifikasi ulang status ke API Midtrans, (d) pemrosesan idempoten
        (`payments.provider_ref` unik; `ledger_entries` append-only). Duplikat/out-of-order
        tidak menambah entri buku besar dan tidak memindahkan `reserved → sold` dua kali
        (AC-13.2/AC-13.3).

        `Idempotency-Key` tidak wajib di sini karena pemanggil adalah Midtrans; idempotensi
