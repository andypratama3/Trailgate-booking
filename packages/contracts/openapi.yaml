        status:
          $ref: '#/components/schemas/RouteStatusValue'
        reason:
          type: [string, "null"]
          maxLength: 500
          example: Penutupan sementara karena cuaca ekstrem.
        source:
          type: string
          enum: [official_letter, operator, bmkg, manual]
          description: Asal informasi status.
          example: official_letter
        source_url:
          type: [string, "null"]
          format: uri
          description: Tautan sumber (wajib bila `source` = `official_letter`).
          example: https://rinjani.example.go.id/pengumuman-penutupan
        source_ref:
          type: [string, "null"]
          example: 'SM.15/BTNGP/2026'
        checked_at:
          $ref: '#/components/schemas/DateTime'
        next_closure:
          oneOf:
            - $ref: '#/components/schemas/Closure'
