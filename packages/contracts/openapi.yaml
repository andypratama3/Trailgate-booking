openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: TrailGate Booking API
  version: 1.0.0
  summary: Kontrak API v1 TrailGate (booking kuota jalur pendakian, multi-tenant).
  description: |
    **Kontrak ini adalah sumber kebenaran** (contracts-first, PRD §11). Tipe TypeScript di
    `src/generated/**` di-*generate* dari file ini; perubahan kontrak hanya lewat ADR oleh
    `tg-architect` (OWNERS.md). Konsumen (`apps/web`, `apps/pos`, `apps/api`) mengonsumsi tipe
    ter-generate, bukan menyalin bentuk payload.

    **Versi di URL.** Semua path kanonik memakai prefix `/v1` (PRD §11). Origin/prefix teknis
    (mis. `api.trailgate.id`, reverse proxy, atau prefix rute framework) bukan bagian kontrak.

    **Tenant: bukan path parameter.** Tenant di-resolve dari host/subdomain (`Host` header) atau
    dari token (mis. token perangkat POS, token super admin), sekali per request di middleware
    (ADR-001 keputusan 3). Tidak ada endpoint yang menerima `tenant_id` di body; tidak ada path
    yang memuat tenant **kecuali** webhook Midtrans `/v1/webhooks/midtrans/{tenant}`, yang
    diwajibkan PRD §11 dan ADR-002 keputusan 3 (Midtrans hanya tahu URL yang kita daftarkan).
    Deklarasi mesin: lihat `x-tenancy`. Mode `TENANT_MODE=single` (paket template single-tenant)
    memakai **build dan kontrak yang sama**: resolusi tenant di-short-circuit ke satu baris
    `tenants`, skema/kolom/scope tetap dipakai, dan tidak ada percabangan perilaku API
    (ADR-001 keputusan 6). Klien tidak boleh mengasumsikan mode; keduanya dilayani kontrak ini.

    **Uang = integer rupiah.** Semua nominal memakai `Money` (integer, tanpa desimal, `IDR`);
    `float`/`double` dilarang untuk uang (ADR-002 keputusan 9, AGENTS.md aturan 6). Nilai desimal
    dari penyedia pembayaran (mis. `gross_amount_raw` Midtrans) dikonversi ke integer sebelum
    disimpan.

    **Waktu.** Semua timestamp memakai RFC 3339 dengan offset eksplisit (`DateTime`); tanggal
    kalender memakai `LocalDate`. Jadwal kuota, jendela pembukaan, cutoff, dan perbandingan
    tanggal dievaluasi dalam **zona waktu jalur** (`routes.timezone`, mis. `Asia/Makassar`) —
    bukan zona server, bukan zona klien (PRD §8, AC-26.4). Deklarasi mesin: `x-time-semantics`.

    **Idempotensi.** Setiap operasi tulis menerima header `Idempotency-Key` (PRD §10.3/§11);
    pengiriman ulang key yang sama menghasilkan satu resource/charge (AC-27.3). Webhook Midtrans
    adalah satu-satunya pengecualian (dipanggil penyedia, bukan klien kita): idempotensinya
    diturunkan dari `order_id` + `payments.provider_ref` unik dan verifikasi signature
    (ADR-002 keputusan 3/4).

    **Galat.** Amplop galat selalu `{code, message, details}` (`Error`); `code` berasal dari
    daftar tertutup `ErrorCode`. Setiap operasi mendeklarasikan respons galatnya lewat komponen
    bersama di `components.responses`.

    **Pagination.** Semua operasi ber-`x-paginated: true` memakai parameter kueri `page` dan
    `per_page` serta amplop `{data, meta}` dengan `meta` = `PageMeta`.

    **Autentikasi & RBAC.** Setiap operasi mendeklarasikan `security` (skema dari
    `components.securitySchemes`), ekstensi `x-auth` (kelas autentikasi), dan `x-rbac-scopes`
    (scope yang dibutuhkan). Peran FR-01 dan scope-nya ada di `x-rbac-roles`; kosakata scope di
    `x-rbac-scopes`. Peran: `super_admin`, `tenant_admin`, `kasir`, `petugas pos` (`pos_officer`),
    `guide`, `pendaki` (`hiker`), ditambah `anonymous` (pengunjung publik) dan `midtrans_webhook`
    (bukan peran manusia). Matriks peran×endpoint ini diuji oleh tes kontrak.

    **Rate limit.** 429 dengan kode `rate_limited` dan header `Retry-After` diterapkan per
    IP/akun/tenant (PRD §11/§13, AC-27.1).
  license:
    name: Proprietary (TrailGate)
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{tenant_host}
    description: >
      Origin per tenant (subdomain atau domain kustom, ADR-001/FR-02). Tenant aktif diambil dari
      `Host` header. Mode `TENANT_MODE=single` memakai origin tunggal pelanggan.
    variables:
      tenant_host:
        default: demo.trailgate.id
        description: Subdomain default (`<tenant>.trailgate.id`) atau domain kustom tenant.
tags:
  - name: public
    description: Katalog, status jalur, ketersediaan kuota, langganan alert — anonim.
  - name: booking
    description: Hold kuota, pengisian anggota, pembayaran, reschedule, pembatalan.
  - name: documents
    description: Dokumen identitas/syarat (surat sehat, izin ortu, consent, asuransi) via signed URL.
  - name: payments
    description: Webhook penyedia pembayaran (Midtrans BYO per tenant).
  - name: console
    description: Konsol tenant — kuota, closure, disruption, booking, laporan, rules.
  - name: pos
    description: PWA petugas pos — batch scan offline, manifest, daftar revoke.
  - name: admin
    description: Super admin platform — tenant dan billing (invoice bulanan).
x-tenancy:
  resolution: host-or-token
  host_header: Host
  path_parameter: false
  token_schemes:
    - posDeviceToken
    - platformAdminToken
    - bookingLinkToken
  path_exceptions:
    - /v1/webhooks/midtrans/{tenant}
  modes:
    saas: >
      Resolusi tenant per request dari subdomain/domain kustom; `tenant_id` + global scope
      menyuntikkan filter pada setiap query tenant-scoped (ADR-001 keputusan 2/3).
    single: >
      `TENANT_MODE=single`: tepat satu baris `tenants`; resolusi di-short-circuit ke tenant itu.
      Skema, kolom `tenant_id`, global scope, migrasi, dan kontrak API tetap sama; tidak ada
      percabangan pada jalur tulis data (ADR-001 keputusan 6).
x-time-semantics:
  storage: UTC
  evaluation: route-local
  route_timezone_field: routes.timezone
  reference_timezone: Asia/Makassar
  timestamps: "RFC 3339 dengan offset eksplisit; tipe schema: DateTime"
  calendar_dates: "LocalDate dalam zona waktu jalur (AC-26.4), mis. 2026-12-31 berarti 2026-12-31 di Asia/Makassar"
  rule: >
    Jendela pembukaan kuota, cutoff, batas check-in, dan perbandingan `date`/`starts_at`/`ends_at`
    dihitung di `routes.timezone`; klien menampilkan waktu dalam zona jalur, bukan zona server
    (PRD §8, AC-26.4; ADR-003 keputusan 1/3).
x-money:
  currency: IDR
  representation: integer
  schema: '#/components/schemas/Money'
  rule: >
    Integer rupiah tanpa desimal; `float`/`double`/`decimal` dilarang (ADR-002 keputusan 9).
    Nilai desimal dari penyedia pembayaran dikonversi sebelum disimpan.
x-idempotency:
  header: Idempotency-Key
  required_on: "semua operasi tulis, kecuali webhook Midtrans"
  retention: 24 jam
  scope: per tenant + per operasi + per key
  contract: "retry dengan key sama → resource/charge yang sama (AC-27.3, ADR-003 keputusan 6)"
x-pagination:
  params: [page, per_page]
  meta_schema: '#/components/schemas/PageMeta'
  envelope: '{data: [...], meta: PageMeta}'
x-rbac-scopes:
  public.read: Baca katalog, status jalur, ketersediaan kuota (anonim maupun terautentikasi).
  alerts.subscribe: Berlangganan notifikasi "beri tahu saya jika dibuka" (FR-35).
  booking.create: Membuat hold booking (termasuk anonim; dibatasi rate limit + captcha).
  booking.member.manage: Mengisi/mengubah data anggota lewat link booking bertanda tangan.
  booking.pay: Membuat transaksi pembayaran Midtrans untuk booking tersebut.
  booking.reschedule: Mengajukan reschedule booking tersebut (§6.4).
  booking.cancel: Membatalkan booking tersebut.
  documents.upload: Mendapatkan signed upload URL untuk dokumen anggota.
  documents.read: Mendapatkan signed download URL untuk dokumen anggota (akses dicatat, ADR-005).
  console.quota.read: Melihat slot kuota tenant.
  console.quota.write: Mengubah kapasitas slot kuota (tidak boleh di bawah reserved+sold, ADR-003).
  console.closure.read: Melihat closure jalur.
  console.closure.write: Membuat/mengonfirmasi/membatalkan closure (wajib sumber surat, PRD §6.1).
  console.disruption.read: Melihat Disruption Case.
  console.disruption.write: Menyelesaikan Disruption Case (refund/reschedule/closed).
  console.booking.read: Melihat booking tenant (daftar dan detail).
  console.report.read: Menjalankan laporan operasional/finansial.
  console.rules.read: Melihat requirement rule jalur.
  console.rules.write: Membuat/mengubah requirement rule (wajib `source_url` + `verified_at`).
  pos.scan: Sinkron event check-in/out, manifest, dan daftar revoke tiket (perangkat POS).
  admin.tenants.read: Melihat tenant lintas-tenant (super admin).
  admin.tenants.write: Membuat/mengubah tenant lintas-tenant (super admin).
  admin.billing.read: Melihat invoice bulanan platform (FR-28, P3).
  webhook.ingest: Menerima webhook penyedia pembayaran (signature terverifikasi).
x-rbac-roles:
  anonymous: [public.read, alerts.subscribe, booking.create]
  hiker:
    [public.read, alerts.subscribe, booking.create, booking.member.manage, booking.pay,
     booking.reschedule, booking.cancel, documents.upload, documents.read]
  guide: [public.read, console.booking.read]
  pos_officer: [pos.scan]
  kasir: [public.read, console.quota.read, console.booking.read, console.report.read, documents.read]
  tenant_admin:
    [public.read, console.quota.read, console.quota.write, console.closure.read,
     console.closure.write, console.disruption.read, console.disruption.write,
     console.booking.read, console.report.read, console.rules.read, console.rules.write,
     documents.read]
  super_admin: [admin.tenants.read, admin.tenants.write, admin.billing.read]
  midtrans_webhook: [webhook.ingest]
paths:
  /v1/routes:
    get:
      operationId: listRoutes
      security: []
      tags: [public]
      summary: Daftar jalur tenant
      description: >
        Katalog jalur milik tenant yang di-resolve dari host, dengan status buka/tutup ringkas
        dan sisa kuota 7 hari ke depan (AC-03.3). Tenant `official_link` mengembalikan
        `booking_enabled: false` dan `deep_link_url` ke sistem resmi (FR-35).
      x-auth: none
      x-rbac-scopes: [public.read]
      x-paginated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: mountain
          in: query
          required: false
          description: Filter slug gunung.
          schema:
            type: string
            maxLength: 80
            example: rinjani
        - name: q
          in: query
          required: false
          description: Pencarian nama jalur/gunung.
          schema:
            type: string
            maxLength: 100
            example: sembalun
        - name: status
          in: query
          required: false
          description: Filter status jalur.
          schema:
            $ref: '#/components/schemas/RouteStatusValue'
      responses:
        "200":
          description: Daftar jalur (ter-paginasi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteList'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/routes/{slug}:
    parameters:
      - $ref: '#/components/parameters/PathSlug'
    get:
      operationId: getRoute
      security: []
      tags: [public]
      summary: Detail jalur
      description: >
        Detail satu jalur: profil, GeoJSON, persyaratan aktif (requirement rules) dengan
        `source_url` + `verified_at`, dan ringkasan ketersediaan.
      x-auth: none
      x-rbac-scopes: [public.read]
      responses:
        "200":
          description: Detail jalur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/routes/{slug}/availability:
    parameters:
      - $ref: '#/components/parameters/PathSlug'
    get:
      operationId: getRouteAvailability
      security: []
      tags: [public]
      summary: Ketersediaan kuota per tanggal
      description: >
        Sisa kuota per tanggal untuk rentang `from`..`to` (maksimum 62 hari). Tanggal
        diinterpretasikan dalam `routes.timezone` (AC-26.4). Slot yang tertutup closure
        mengembalikan `status: closed` dan `effective_capacity: 0` (ADR-003 keputusan 3).
      x-auth: none
      x-rbac-scopes: [public.read]
      parameters:
        - name: from
          in: query
          required: true
          description: Tanggal awal (inklusif), zona waktu jalur.
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: true
          description: Tanggal akhir (inklusif), zona waktu jalur.
          schema:
            $ref: '#/components/schemas/LocalDate'
      responses:
        "200":
          description: Ketersediaan kuota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/routes/{slug}/status:
    parameters:
      - $ref: '#/components/parameters/PathSlug'
    get:
      operationId: getRouteStatus
      security: []
      tags: [public]
      summary: Status buka/tutup jalur
      description: >
        Status terkini beserta sumber dan waktu verifikasi (PRD §6.1: aturan tanpa sumber =
        tidak dapat dipercaya). Tenant `official_link` memakai endpoint ini sebagai sumber
        tampilan "status resmi + tanggal" (AC-35.1).
      x-auth: none
      x-rbac-scopes: [public.read]
      responses:
        "200":
          description: Status jalur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteStatus'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/routes/{slug}/alerts:
    parameters:
      - $ref: '#/components/parameters/PathSlug'
    post:
      operationId: subscribeRouteAlert
      security: []
      tags: [public]
      summary: Langganan notifikasi "beri tahu saya jika dibuka"
      description: >
        Dipakai mode Official Link Mode (FR-35 AC-35.3). Anonim, karena itu dibatasi rate limit
        per IP dan captcha adaptif (PRD §13). Notifikasi dikirim saat status jalur berubah
        menjadi `open`.
      x-auth: none
      x-rbac-scopes: [alerts.subscribe]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSubscriptionRequest'
      responses:
        "201":
          description: Langganan tercatat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteAlertSubscription'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/bookings:
    post:
      operationId: createBookingHold
      security: []
      tags: [booking]
      summary: Hold kuota (reservasi 15 menit)
      description: |
        Membuat booking `Held` dan menahan kuota lewat service `ReserveSlot` (ADR-003
        keputusan 2; invarian `reserved + sold <= effective_capacity` dijaga di MySQL).
        Satu-satunya endpoint booking yang anonim: respons menerbitkan `access.token`
        (link token) untuk langkah berikutnya. Hold dilepas otomatis oleh job bila
        `hold_expires_at` lewat (PRD §6.4: TTL 15 menit).

        Kode galat domain: `quota_exceeded` (sisa kuota tidak cukup), `slot_closed`
        (closure aktif → `effective_capacity = 0`), `booking_window_closed` (di luar jendela
        pembukaan/cutoff, dievaluasi dalam `routes.timezone`), `official_link_no_transaction`
        (tenant `official_link` tidak punya transaksi, AC-35.2), `members_locked`.
      x-auth: none
      x-rbac-scopes: [booking.create]
      x-adr: [ADR-003]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingHoldRequest'
      responses:
        "201":
          description: Hold dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHoldResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          description: >
            Konflik kuota/status. `code`: `quota_exceeded`, `slot_closed`,
            `booking_window_closed`, `official_link_no_transaction`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/bookings/{code}/members/{id}:
    parameters:
      - $ref: '#/components/parameters/PathBookingCode'
      - $ref: '#/components/parameters/PathMemberId'
    put:
      operationId: updateBookingMember
      security:
        - bookingLinkToken: []
      tags: [booking]
      summary: Isi/ubah data anggota booking
      description: >
        Dipakai ketua rombongan atau anggota lewat link bertanda tangan (FR-09: "link pengisian
        untuk anggota"). Nomor identitas (NIK/paspor) disimpan terenkripsi dan hanya
        dikembalikan dalam bentuk tersamarkan (`identity_masked`), ADR-005 keputusan 1/2.
        PUT idempoten: kirim ulang payload yang sama tidak menggandakan perubahan.
      x-auth: link_token
      x-rbac-scopes: [booking.member.manage]
      x-adr: [ADR-005]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        "200":
          description: Anggota tersimpan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingMember'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: >
            Anggota tidak dapat diubah pada status booking ini. `code`: `members_locked`,
            `conflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/bookings/{code}/pay:
    parameters:
      - $ref: '#/components/parameters/PathBookingCode'
    post:
      operationId: payBooking
      security:
        - bookingLinkToken: []
      tags: [booking]
      summary: Buat transaksi pembayaran (Snap/VA/QRIS)
      description: >
        Membuat transaksi di akun Midtrans **tenant** (BYO merchant, ADR-002 keputusan 2) dan
        mengembalikan token/redirect. Settlement tidak ditentukan oleh respons ini, tetapi oleh
        webhook `POST /v1/webhooks/midtrans/{tenant}`: `reserved → sold` dipindahkan dalam satu
        transaksi dan `ledger_entries` bertambah tepat satu entri (AC-13.3).
        Kode galat domain: `tenant_not_payment_ready` (kredensial Midtrans tenant belum ada,
        ADR-002 keputusan 7), `official_link_no_transaction` (AC-35.2), `conflict`
        (booking bukan pada status yang dapat dibayar).
      x-auth: link_token
      x-rbac-scopes: [booking.pay]
      x-adr: [ADR-002]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        "200":
          description: Transaksi pembayaran dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: >
            Tidak dapat dibayar. `code`: `tenant_not_payment_ready`,
            `official_link_no_transaction`, `conflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /v1/bookings/{code}/reschedule:
    parameters:
      - $ref: '#/components/parameters/PathBookingCode'
    post:
      operationId: rescheduleBooking
      security:
        - bookingLinkToken: []
      tags: [booking]
      summary: Reschedule booking
      description: >
        Memindahkan kuota ke tanggal baru lewat `ReserveSlot` (ADR-003) dan mengevaluasi aturan
        tenant (§6.4: anggota tidak boleh berubah, satu kali gratis, batas kelompok per hari).
        Kode galat domain: `reschedule_not_allowed`, `members_locked`, `quota_exceeded`,
        `slot_closed`.
      x-auth: link_token
      x-rbac-scopes: [booking.reschedule]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        "200":
          description: Booking setelah reschedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: >
            Reschedule ditolak. `code`: `reschedule_not_allowed`, `members_locked`,
            `quota_exceeded`, `slot_closed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
