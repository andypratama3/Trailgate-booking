        checkpoint_id:
          type: string
          example: sembalun-gate
        type:
          type: string
          enum: [in, out]
          example: in
        scanned_at:
          $ref: '#/components/schemas/DateTime'
        device_id:
          type: string
          maxLength: 64
          example: pos-sembalun-01
      example:
        client_event_id: 018f3a1e-5a10-4c22-9f01-6b2c3d4e5f60
