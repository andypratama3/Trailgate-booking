    MidtransNotification:
      type: object
      description: >
        Payload notifikasi Midtrans (Snap/VA/QRIS). `signature_key` = sha512(order_id +
        status_code + gross_amount + server key tenant) dan wajib diverifikasi sebelum
        diproses; status juga diverifikasi ulang ke API Midtrans (AC-13.2).
      required: [order_id, status_code, gross_amount_raw, transaction_status, signature_key]
      additionalProperties: true
      properties:
        order_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Order ID Midtrans = kode booking.
          example: TG-7QK2M9
        status_code:
          type: string
          pattern: '^[0-9]{3}$'
          example: '200'
        gross_amount_raw:
          type: string
          pattern: '^[0-9]+(\.[0-9]{2})?$'
          description: >
            Nilai mentah Midtrans (desimal string). Dikonversi ke integer rupiah sebelum
            disimpan; API tidak pernah menyimpan uang sebagai pecahan (ADR-002 keputusan 9).
          example: '350000.00'
        transaction_status:
          type: string
          enum:
            [capture, settlement, pending, deny, cancel, expire, refund, partial_refund,
             chargeback, partial_chargeback, failure]
          example: settlement
        fraud_status:
          type: [string, "null"]
          enum: [accept, challenge, deny, null]
          example: accept
        payment_type:
          type: [string, "null"]
          enum:
            [credit_card, bank_transfer, gopay, qris, shopeepay, cstore, echannel, null]
          example: qris
        transaction_id:
          type: [string, "null"]
          description: ID transaksi Midtrans (dipakai sebagai `payments.provider_ref`).
          example: 0e5d6c1a-77d2-4d1a-9c67-2f1e4b5c6d70
        transaction_time:
          type: [string, "null"]
          format: date-time
          example: '2026-11-24T09:41:00+07:00'
        signature_key:
          type: string
          pattern: '^[0-9a-f]{128}$'
          example: 8f14e45fceea167a5a36dedd4bea2543a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
      example:
        order_id: TG-7QK2M9
        status_code: '200'
        gross_amount_raw: '350000.00'
        transaction_status: settlement
        fraud_status: accept
        payment_type: qris
        transaction_id: 0e5d6c1a-77d2-4d1a-9c67-2f1e4b5c6d70
        transaction_time: '2026-11-24T09:41:00+07:00'
        signature_key: 8f14e45fceea167a5a36dedd4bea2543a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
    WebhookAck:
      type: object
      description: Pengakuan webhook (200 selalu dikembalikan bila signature valid, agar tidak di-retry tanpa henti).
      required: [received, processed]
      additionalProperties: false
      properties:
        received:
          type: boolean
          example: true
        processed:
          type: boolean
          description: Ditandai `false` bila notifikasi duplikat/out-of-order dan tidak mengubah state.
          example: true
        reason:
          type: [string, "null"]
          example: null
        booking_code:
          type: [string, "null"]
          example: TG-7QK2M9
      example:
        received: true
        processed: true
        reason: null
        booking_code: TG-7QK2M9
    QuotaSlot:
      type: object
      description: Slot kuota satu jalur × satu tanggal (tenant-scoped, ADR-003 keputusan 1).
      required:
        [route_slug, date, capacity, reserved, sold, effective_capacity, remaining, version,
         closure_active]
      additionalProperties: false
      properties:
        route_slug:
          type: string
          example: rinjani-sembalun
        date:
          $ref: '#/components/schemas/LocalDate'
        capacity:
          type: integer
          format: int32
          minimum: 0
          example: 300
        reserved:
          type: integer
          format: int32
          minimum: 0
          example: 30
        sold:
          type: integer
          format: int32
          minimum: 0
          example: 228
        effective_capacity:
          type: integer
          format: int32
          minimum: 0
          description: 0 bila closure aktif; dihitung service dalam transaksi tulis.
          example: 300
        remaining:
          type: integer
          format: int32
          minimum: 0
          example: 42
        version:
          type: integer
          format: int64
          minimum: 0
          description: Versi baris untuk deteksi perubahan optimistik.
          example: 17
        closure_active:
          type: boolean
          example: false
      example:
        route_slug: rinjani-sembalun
        date: '2026-12-31'
        capacity: 300
        reserved: 30
        sold: 228
        effective_capacity: 300
        remaining: 42
        version: 17
        closure_active: false
