acceptance:
  - "pipelines GitHub Actions: lint/static (pint + larastan/phpstan), tests (PHPUnit), frontend (tsc + eslint), e2e smoke (Playwright)"
  - "composer audit dan npm audit jalan di CI dan gagal pada advisory level yang disepakati"
  - "pemindaian rahasia (secret scan) jalan dan gagal bila ada kandidat rahasia"
  - "[setting-gated] langkah security_scan: sediakan job/placeholder yang aktif bila tool tersedia, gagal-aman (fail-safe) bila tidak"
  - "CI gagal bila tes isolasi tenant gagal (hook untuk T-101) — sediakan job placeholder yang jelas"
  - "Level phpstan disepakati dan dicatat di ADR (rujuk T-005 ADR-006/ADR terkait); jangan pakai level yang tidak disepakati"
  - "Workflow dapat dijalankan lokal (Makefile target) dan di CI"
  - "Image produksi (infra/) berjalan sebagai NON-ROOT (www-data/node) — temuan tg-security T-001 F1B-4; image dev boleh tetap root."
  - "Base image dipin tag penuh/digest dan `pecl install redis` dipin versi — temuan tg-security T-001 F1B-5."
  - "Secret scan punya allowlist TERTULIS yang TANPA memuat nilai kunci apa pun: rule allowlist bersifat path+commit-scoped (`apps/api/.env.testing` di commit f29df88; nilai kunci sudah dikosongkan ke depan di dc58998, lihat O-7). DILARANG menyalin nilai kunci penuh ke dalam repo (tg-security F-8: aturan berbasis nilai yang dipotong-potong tidak akan cocok, sedangkan aturan berbasis path+commit tetap cocok). Tanpa rule ini, secret scan gagal pada hari pertama."
  - "`docker/api/Dockerfile` CMD masih `php artisan serve` TANPA `--no-reload` — cacat env-stripping yang sudah diperbaiki di `docker-compose.yml`. Samakan atau hapus CMD-nya (satu sumber kebenaran). Temuan tg-architect T-001 F-8."
  - "Komentar `pin digest menunggu ADR-006` di `docker/api/Dockerfile` harus menunjuk ADR-006 §3 sebagai item TERBUKA berdeadline T-008 (ADR-006 sudah accepted). Temuan F-9."
  - "Tes kontrak packages/contracts diwiring ke CI: job yang menjalankan `pnpm -C packages/contracts validate` + `test` + `generate:check` + `typecheck` (temuan tg-ocr T-006 F-13; tanpa ini kontrak bisa drift tanpa terdeteksi)."
  - "Checkout bersih tidak merah: generated `packages/contracts/src/generated/openapi.d.ts` ikut commit ATAU step `generate` dijalankan sebelum `typecheck` (temuan tg-ocr T-006 F-1, P1)."
  - "Job/token gates untuk pipeline token T-010 (AC-5 T-010): setelah `next build`, jalankan `pnpm -C packages/design-tokens check` (drift css/ vs build), `check-doc-parity`, `check-no-hardcode`, dan `budget:require-app` — gagal bila melewati batas (temuan tg-reviewer T-010 F-1 P1; spesifikasi di `docs/ux/token-pipeline.md` §7)."
  - "Sementara `apps/pos/app/manifest.ts:10-11` masih hardcode hex (milik tg-console), scope `check-no-hardcode` ke `apps/web/app packages/ui` — jangan biarkan CI merah hari pertama (temuan tg-reviewer T-010 F-3)."
