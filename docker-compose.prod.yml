# docker-compose.prod.yml — Stack produksi (image digest-pinned, non-root, tg-devops).
# Deploy: infra/deploy/build.sh → push → infra/deploy/deploy.sh → rolling restart.
#
# Base image pin digest: ADR-006 §3 (F1B-5).
# Non-root: www-data (php-fpm), node (web), nginx worker non-root (default).
# Rahasia: selalu dari env/secret manager, TIDAK dari file ter-commit (AGENTS.md #11).

name: trailgate-prod

x-prod-env: &prod-env
  APP_ENV: production
  APP_DEBUG: "false"
  SESSION_DRIVER: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  APP_KEY: ${APP_KEY:?set APP_KEY via secret manager}
  APP_URL: ${APP_URL:?set APP_URL via secret manager}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:?set via deploy env}
  DB_USERNAME: ${MYSQL_USER:?set via deploy env}
  DB_PASSWORD: ${MYSQL_PASSWORD:?set via deploy env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"


services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    # NON-ROOT: nginx worker non-root (default image), reverse proxy tidak butuh root.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM production: NON-ROOT (www-data), OPcache aktif.
  api:
    build:
      context: .
      dockerfile: infra/php-fpm/Dockerfile
    # NON-ROOT (F1B-4): USER www-data dari infra/php-fpm/Dockerfile (uid 33) — tanpa override user di sini.
    working_dir: /var/www/html
    volumes:
      - ./apps/api/storage:/var/www/html/storage
      - ./apps/api/bootstrap/cache:/var/www/html/bootstrap/cache
    # Env dari secret manager/deploy (no env_file — .env tidak pernah ter-commit).
    environment: *prod-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Queue worker: NON-ROOT (www-data).
  worker:
    build:
      context: .
      dockerfile: infra/php-fpm/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    # Env dari secret manager/deploy (no env_file).
    environment: *prod-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js production build: NON-ROOT (node), standalone output.
  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    # NON-ROOT: node (uid 1000, tg-security F1B-4). Tidak ada volume mount.
    # Env dari secret manager/deploy (no env_file).
    environment:
      <<: *prod-env
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/v1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4@sha256:f0c7a4430d773ef8433aae82e08cb02ade4a6ad806a18b1610a48a1728fbdfd5
    # Kredensial dari secret manager/deploy env — bukan file ter-commit (AGENTS.md #11).
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set via deploy env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set via deploy env}
      MYSQL_USER: ${MYSQL_USER:?set via deploy env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set via deploy env}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:e4ee3e03ce8f75471f40937a7c6b2b0e500390b6812fcdf5cb32c01295ded446
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_prod_data:
  redis_prod_data:
