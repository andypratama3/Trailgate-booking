; PHP produksi — OPcache aktif, display_errors off, log ke stderr (container-native).
; Rahasia selalu dari environment/secret manager (AGENTS.md #11), bukan file ter-commit.
[PHP]
memory_limit = 256M
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
