; Pool www produksi — user www-data (non-root, F1B-4).
; Tangani via socket unix agar nginx dan fpm sesama user www-data.
[www]
user = www-data
group = www-data
listen = /run/php-fpm/www.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
