# Nginx produksi — default.conf.
# API (PHP-FPM via unix socket) + Web (Next.js) di satu entry, TLS diterminasi Cloudflare (PRD §9.1).
server {
    listen 8080;
    server_name _;

    root /app/apps/web/.next/standalone;
    index index.html;

    # Security headers (lapisan aplikasi; Cloudflare menambah WAF/rate limit di depan).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # API v1 → PHP-FPM socket (infra/php-fpm/www.conf: /run/php-fpm/www.sock).
    location /v1/ {
        try_files $uri @api;
    }

    location @api {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 60s;
    }

    # Web (Next.js) — proxy ke container apps/web produksi.
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Jangan expose dotfiles (.env, .git, dll).
    location ~ /\. {
        deny all;
    }
}
